<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Loose Ends</title>
  <!-- Telegram Mini App -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>window.LE_IDS = {"adsgramInterstitial": "int-51421", "adsgramRewarded": "51422"};</script>
  <style>
    :root {
      --bg: #11131d;
      --bg-2: #1a1d2b;
      --card: #1d2131;
      --text: #eef0fa;
      --muted: #8d93ad;
      --accent: #7dd3fc;
      --heart: #fb7185;
      --chip: color-mix(in srgb, var(--text) 9%, transparent);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; height: 100%; overflow: hidden;
      background: radial-gradient(120% 80% at 50% 0%, var(--bg-2), var(--bg));
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: none;
      transition: background .4s, color .4s;
    }
    button { font: inherit; color: inherit; }
    #board { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

    /* ---- верхняя панель ---- */
    #hud {
      position: fixed; top: 0; left: 0; right: 0;
      display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px;
      padding: max(12px, env(safe-area-inset-top)) 14px 6px;
      pointer-events: none;
    }
    #level { font-weight: 800; font-size: 19px; white-space: nowrap; }
    #rank { font-size: 12.5px; color: var(--muted); margin-top: 2px; white-space: nowrap; }
    #hearts { display: flex; gap: 5px; font-size: 22px; }
    .heart { color: var(--heart); transition: transform .2s, opacity .2s; }
    .heart.lost { opacity: .18; transform: scale(.8); }
    #hud-right { justify-self: end; display: flex; gap: 8px; pointer-events: auto; }
    #settings {
      width: 42px; height: 42px; border: 0; border-radius: 21px; cursor: pointer;
      background: var(--chip); font-size: 18px; display: grid; place-items: center;
    }
    .badge {
      display: inline-block; margin-left: 8px; padding: 2px 8px; border-radius: 10px; vertical-align: 2px;
      font-size: 11px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: #1a1205;
    }
    .badge.hard { background: #fbbf24; }
    .badge.boss { background: #fb7185; }
    #hint {
      height: 42px; padding: 0 14px; border: 0; border-radius: 21px; cursor: pointer;
      background: var(--chip); font-size: 19px; display: flex; align-items: center; gap: 7px;
    }
    #hint:disabled { opacity: .35; cursor: default; }
    #hint-count { font-size: 15px; font-weight: 800; color: var(--accent); }

    /* ---- нижняя панель ---- */
    #bar {
      position: fixed; left: 0; right: 0; bottom: 0;
      display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px;
      padding: 8px 14px max(12px, env(safe-area-inset-bottom));
    }
    #bar > button {
      position: relative; height: 44px; padding: 0 14px; border: 0; border-radius: 22px; cursor: pointer;
      background: var(--chip); display: flex; align-items: center; gap: 7px; font-weight: 700; font-size: 15px;
    }
    #daily.done { opacity: .75; }
    #daily-mark {
      position: absolute; top: 6px; right: 7px; width: 9px; height: 9px; border-radius: 50%;
      background: var(--heart); box-shadow: 0 0 0 2px var(--bg);
    }
    #chest { display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 12.5px; color: var(--muted); min-width: 0; }
    #chest.off { visibility: hidden; }
    #chest-label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
    #chest-pips { display: flex; gap: 5px; }
    #chest-pips i { width: 16px; height: 6px; border-radius: 3px; background: var(--chip); }
    #chest-pips i.on { background: var(--accent); }
    #sparks { color: var(--accent); }

    #tip {
      position: fixed; left: 16px; right: 16px; bottom: calc(70px + env(safe-area-inset-bottom));
      text-align: center; color: var(--muted); font-size: 15px; line-height: 1.4; white-space: pre-line;
      pointer-events: none;
    }

    /* ---- карточки ---- */
    #overlay {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px;
      background: rgba(10, 11, 18, .55); backdrop-filter: blur(3px);
    }
    #overlay[hidden] { display: none; }
    #card {
      width: min(360px, 100%); max-height: calc(100% - 16px); overflow: auto;
      text-align: center; padding: 24px 22px 20px; border-radius: 22px;
      background: var(--card); box-shadow: 0 20px 60px rgba(0,0,0,.45);
    }
    #card.pop { animation: pop .28s cubic-bezier(.2,1.4,.4,1); }
    #card h2 { font-size: 27px; font-weight: 850; margin: 0 0 10px; }
    #card .muted { color: var(--muted); margin: 6px 0; line-height: 1.4; }
    .big-emoji { font-size: 64px; margin: 6px 0; line-height: 1.1; }
    .chest-shake { animation: wiggle 1s ease-in-out infinite; display: inline-block; }
    .rank-name { font-size: 34px; font-weight: 900; color: var(--accent); margin: 2px 0 6px; }
    .streak-big { font-size: 30px; font-weight: 900; margin: 4px 0; }
    .stars { display: flex; justify-content: center; gap: 8px; font-size: 44px; margin: 4px 0 12px; }
    .star { color: var(--chip); }
    .star.on { color: #fcd34d; animation: starIn .45s cubic-bezier(.2,1.6,.4,1) both; text-shadow: 0 0 18px rgba(252,211,77,.55); }
    .rows { display: grid; gap: 6px; margin: 4px 0 14px; text-align: left; }
    .row { display: flex; justify-content: space-between; gap: 10px; font-size: 15px; color: var(--muted); }
    .row b { color: var(--text); }
    .row.total { font-size: 19px; color: var(--text); padding-top: 6px; border-top: 1px solid var(--chip); }
    .row.total b { color: var(--accent); }
    .iq { text-align: left; margin-bottom: 16px; }
    .iq-head { display: flex; justify-content: space-between; font-size: 14px; font-weight: 700; margin-bottom: 6px; }
    .iq-head em { color: #86efac; font-style: normal; }
    .meter { height: 10px; border-radius: 5px; background: var(--chip); overflow: hidden; }
    .meter i { display: block; height: 100%; border-radius: 5px; background: linear-gradient(90deg, var(--accent), #86efac); transition: width .9s cubic-bezier(.3,1,.4,1); }
    .actions { display: grid; gap: 8px; margin-top: 6px; }
    .actions button { border: 0; border-radius: 24px; padding: 13px 20px; cursor: pointer; font-size: 18px; font-weight: 800; }
    .actions .primary { background: var(--accent); color: #0b1020; }
    .actions .secondary { background: var(--chip); }
    .actions .danger { background: transparent; color: var(--heart); font-size: 15px; font-weight: 700; }
    .settings { display: grid; gap: 10px; margin: 8px 0 16px; }
    .setting { display: flex; justify-content: space-between; align-items: center; font-size: 17px; font-weight: 700; }
    .switch {
      min-width: 76px; height: 36px; border: 0; border-radius: 18px; cursor: pointer;
      background: var(--chip); color: var(--muted); font-weight: 800;
    }
    .switch.on { background: var(--accent); color: #0b1020; }
    .lang-row { margin: -6px 0 16px; }
    #lang-select {
      max-width: 60%; height: 36px; padding: 0 10px; border: 0; border-radius: 18px; cursor: pointer;
      background: var(--chip); color: var(--text); font: inherit; font-size: 15px; font-weight: 700;
    }
    #lang-select option { background: var(--card); color: var(--text); }
    .wallet { font-size: 20px; font-weight: 800; color: var(--accent); margin: 0 0 12px; }
    .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
    .tile {
      border: 2px solid transparent; border-radius: 16px; padding: 12px 8px; cursor: pointer;
      display: grid; gap: 6px; justify-items: center; font-weight: 700;
    }
    .tile.using { border-color: var(--accent); }
    .tile.locked { opacity: .55; }
    .tile.shake { animation: shake .3s; }
    .hint-line { color: var(--muted); font-size: 13px; margin: -4px 0 12px; }
    .swatch { display: flex; gap: 4px; }
    .swatch i { width: 14px; height: 14px; border-radius: 50%; }
    .tname { font-size: 15px; }
    .tprice { font-size: 13px; opacity: .85; }

    #hand {
      position: fixed; pointer-events: none; transform: translate(-30%, 15%);
      animation: tap 1s ease-in-out infinite; filter: drop-shadow(0 4px 8px rgba(0,0,0,.5));
    }
    @keyframes tap { 0%, 100% { margin-top: 10px; } 50% { margin-top: 0; } }
    @keyframes pop { from { transform: scale(.85); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes starIn { from { transform: scale(0) rotate(-40deg); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes wiggle { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-9deg) scale(1.05); } 75% { transform: rotate(9deg) scale(1.05); } }
    @keyframes shake { 0%,100% { transform: none; } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  </style>
</head>
<body>
  <canvas id="board"></canvas>
  <div id="hud">
    <div><div id="level"></div><div id="rank"></div></div>
    <div id="hearts"></div>
    <div id="hud-right">
      <button id="settings" type="button" aria-label="Settings">⚙️</button>
      <button id="hint" type="button"><span aria-hidden="true">💡</span><span id="hint-count"></span></button>
    </div>
  </div>
  <div id="tip"></div>
  <div id="hand" hidden aria-hidden="true">👆</div>
  <div id="bar">
    <button id="daily" type="button"><span aria-hidden="true">📅</span><span id="streak"></span><span id="daily-mark"></span></button>
    <div id="chest"><span id="chest-label"></span><span id="chest-pips"></span></div>
    <button id="shop" type="button"><span aria-hidden="true">🎨</span><span id="sparks"></span> ✦</button>
  </div>
  <div id="overlay" hidden><div id="card"></div></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
